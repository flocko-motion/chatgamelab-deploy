# prod.cgl.fmnoel.de — production.
#
# It pulls the images CI published rather than building them, so it runs the
# artefact that was tested and carries no toolchain, no build user and no
# source mirror. ./deploy.sh will only deploy a published release tag here.
#
# Expected to pass to JFF. Every value below therefore belongs to whoever owns
# this instance rather than to the development one: its own Auth0 account, its
# own audience, its own contact address. Nothing is shared between the two, so
# handing this over needs no rotation anywhere else.
certbot_email: webmaster@omnitopos.net

# The tenant production already uses, and deliberately not a new one.
#
# app_user.auth0_id holds a tenant-scoped subject, and the middleware looks a
# user up by it alone (server/api/httpx/auth.go:332) with no fallback to email
# — so a restored database can only be signed into from the tenant its users
# came from. Pointing this instance anywhere else would lock out everyone in
# the dump, which would make a rehearsal prove nothing.
#
# That application's allowed URL lists need this origin adding alongside the
# live one. Moving production to an account of its own is a separate exercise
# with the same consequence, and wants doing deliberately rather than as a side
# effect of changing hosts.
#
#   Allowed Callback URLs   https://prod.cgl.fmnoel.de/auth/login/auth0/callback
#   Allowed Logout URLs     https://prod.cgl.fmnoel.de/auth/logout/auth0/callback
#   Allowed Web Origins     https://prod.cgl.fmnoel.de
#
# This host is a rehearsal: run.chatgamelab.eu is where production lands, and
# that is a second host_vars file rather than a rename — a different
# certificate, vhost and callback list against the same box.
auth0_domain: chatgamelab.eu.auth0.com
# The tenant's Management API, which is what production has always used.
# Every tenant has it pre-associated with its applications, so it needs no
# Application Access Policy grant — convenient here, and the reason the
# rehearsal will not hit the authorisation error dev did. Worth replacing with
# a dedicated API eventually: nothing in this codebase calls the Management
# API, so the tokens are nominally scoped to Auth0's own admin surface for no
# reason. Not while a migration is in flight.
auth0_audience: https://chatgamelab.eu.auth0.com/api/v2/
auth0_client_id: UqajOgWm3xl92J4lxZnjlZw14mOXtEJm

# Sentry/GlitchTip. Empty disables reporting on that side.
sentry_dsn_backend: ""
sentry_dsn_frontend: ""

# Pulled, not built. A released version is what production runs, and naming one
# is a deliberate act: ./deploy.sh refuses a ref here that carries no vX.Y.Z
# tag, and checks the registry holds all three images before touching the box.
image_source: registry

# No track_branch, deliberately. Nothing converges on production by itself —
# there is no branch to follow, no trigger, and no timer. A release goes live
# because somebody ran ./deploy.sh naming it.
