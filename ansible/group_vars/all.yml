# True of every instance. What differs per instance lives in host_vars/<host>.yml,
# which is also the file that has to exist before ./deploy.sh will accept a
# server name.

# Both repositories are public and are fetched over https, so the box holds no
# GitHub credential of any kind: no deploy key, no token, nothing whose leak
# would matter. The deploy repository can be public because it carries no
# secrets — every value the instance needs is either committed config here or
# generated on the box itself (see box/cgl-env).
# Pinned to Debian's own maintained symlink, rather than leaving ansible to
# rediscover it every run and warn about it. The warning is real rather than
# noise: discovery picks the concrete /usr/bin/python3.13 today, and a later
# Debian point release that moves to 3.14 would have it silently choose
# differently. The symlink stays valid across that.
ansible_python_interpreter: /usr/bin/python3

# Where an instance's images come from, per host:
#
#   build     the box compiles them from source, so it can run any commit
#             rather than only the ones a registry holds. Wants ~1.7 GB free
#             during a build and a toolchain on the box. What development uses.
#   registry  the box pulls what CI published, by tag. No Node, no Go, no
#             build user, no mirror — and the artefact is the one CI tested
#             rather than a local recompilation. What production uses.
#
# host_vars sets it; this is the default so an omission fails safe, towards the
# cheaper and more constrained of the two.
image_source: registry

# Read only when image_source is "registry". Public, so the box pulls with no
# credential of any kind.
image_registry: ghcr.io/flocko-motion

app_repo: https://github.com/flocko-motion/chatgamelab.git
deploy_repo: https://github.com/flocko-motion/chatgamelab-deploy.git

# Headroom for the frontend build, which runs tsc and vite beside Postgres and
# two containers. 4 GB of swap on a box with 3854 MB of RAM is a safety net
# rather than working space: swappiness stays low, so this is what stands
# between a tight build and the OOM killer, and costs nothing on the 111 GB
# free otherwise.
swapfile_path: /swapfile
swapfile_size_mb: 4096
# Low rather than off: idle pages stay resident, and the file is reached only
# under real pressure — which is both what a build wants and what Postgres
# prefers.
swappiness: 10

# Two unprivileged users, two subuid ranges, and no root anywhere in the
# picture except nginx's master process and sshd.
#
# The split is the point. Building runs `npm ci` over 477 packages and executes
# their install scripts; that happens as build_user, whose namespace can reach
# neither the running containers nor the database volume. The stack runs as
# runtime_user. Rootful Docker would give the same convenience and neither
# boundary, since membership in the docker group is root-equivalent.
runtime_user: cgl
runtime_home: /var/lib/cgl
build_user: cgl-build
build_home: /var/lib/cgl-build

# The unprivileged users this host actually needs. The build user exists only
# where the box compiles — on a pulling instance it would be surface with
# nothing to do, and surface is the thing a production box inherited by someone
# else should have least of.
#
# The subordinate ranges are 65536 apart and never overlap, so neither
# namespace can reach the other's files even by uid collision.
box_users: >-
  {{ [{'name': runtime_user, 'home': runtime_home, 'base': 200000}]
     + ([{'name': build_user, 'home': build_home, 'base': 300000}]
        if image_source == 'build' else []) }}

# Where the deploy repository clones itself on the box. Phase two runs from
# here, so the box redeploys without a laptop in the loop.
#
# Under /opt rather than in runtime_user's home, because build_user has to
# execute box/cgl-build out of it and Debian creates a home mode 0700 — which
# refuses the traversal however the script's own bits are set. Neither user's
# home is on the other's path for anything.
deploy_base: /opt/chatgamelab
deploy_clone: "{{ deploy_base }}/deploy"

# The stack's environment file: committed config from host_vars, plus the two
# values generated on the box and never held anywhere else (see box/cgl-env).
# Where box/lib.sh reads the paths from. Beside the clone rather than in
# runtime_user's home, because build_user has to read it too and a home is mode
# 0700 — the same reason the clone itself lives here. This one path is all that
# box/ hardcodes, since it is what tells box/ where everything else lives.
#
# The stack's own two environment files, env.config and env.secret, are derived
# from runtime_home by box/lib.sh rather than named here: one definition each,
# in the place that opens them.
box_env: "{{ deploy_base }}/box.env"

# The bare mirror every checkout comes from. A full mirror is ~100 MB, which
# buys the ability to check out any reachable commit without depending on
# GitHub serving arbitrary SHAs to `git fetch`.
app_mirror: "{{ build_home }}/chatgamelab.git"
app_worktree: "{{ build_home }}/src"

# Images move between the two rootless stores as a file, since neither user can
# read the other's storage. Under /var/tmp because a handoff is worth exactly
# as long as the deploy that made it.
handoff_dir: /var/tmp/cgl-handoff

# The web container binds here and nginx is the sole public entry point,
# terminating TLS. Above 1024, because a rootless container cannot bind lower.
web_bind_address: 127.0.0.1
web_bind_port: 8080

# Rootless podman speaks the Docker API on this socket, which lets the app
# repository's own docker-compose.yml run verbatim — including
# `depends_on: condition: service_healthy`, the part every compose
# reimplementation handles worst.
podman_socket: "/run/user/{{ runtime_uid }}/podman/podman.sock"

# The public halves of the keys allowed in as runtime_user. Public key material,
# so committing it is safe, and listing it here rather than reading your
# ~/.ssh means the box admits the same keys whichever machine runs ./deploy.sh —
# a laptop and a desktop, macOS and Linux.
#
# Root's own key is installed through your provider's console, and is needed
# only for the first run: ground setup is what creates runtime_user.
deploy_public_keys:
  - "ssh-rsa  flo@787dd836-a972-4ed4-b67e-c79bb791b4a7"
  - "ssh-rsa  flo@DESKTOP-UTS0MA1"

# ---------------------------------------------------------------- auto-deploy

# The box converges on its tracked branch by itself, so collaborators see their
# merges without anyone running anything. ./deploy.sh is the override: it names
# a commit, and that commit stays until the next trigger or timer tick moves
# the box back onto the branch.
#
# This is the one place where a branch name rather than a resolved SHA reaches
# the box, necessarily — the box is what does the resolving when nobody is
# driving. The safety of that rests on who can push the branch, which is why
# the README's trust boundaries name it.

# The trigger endpoint CI posts to. The listener behind it binds to localhost;
# nginx is its only public entry point, so the address CI uses is
# https://<domain>{{ hook_path }}.
hook_path: /_hooks/deploy
hook_port: 8081

# The HMAC secret the endpoint verifies X-Hub-Signature-256 against. ./deploy.sh
# mints a fresh one every run and writes both ends itself — here over SSH, and
# on GitHub as the Actions secret below — so it rotates on its own, lives in no
# password manager, and nobody ever reads it. While it is empty every trigger is
# rejected, which costs a deploy its promptness and nothing else.
hook_secret_path: "{{ runtime_home }}/hook-secret"

# What that same secret is called on the GitHub side, in the application
# repository whose workflow signs with it.
hook_secret_name: CGL_DEPLOY_HOOK_SECRET
app_repo_slug: flocko-motion/chatgamelab

# Where the listener drops the file the update unit watches. Under /run
# deliberately: a trigger is worth exactly as long as the boot it arrived in,
# and one surviving a reboot would deploy nothing new anyway.
hook_runtime_dir: /run/cgl-deploy

# How long a trigger that never arrives can delay a deploy.
update_interval: 15min
