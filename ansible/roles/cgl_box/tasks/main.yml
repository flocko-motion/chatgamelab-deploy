---
# Two directories, because the ownership differs and both halves matter.
# deploy_base is root's and merely traversable; the clone inside it is
# runtime_user's, so the git module can write there as that user, and 0755 so
# build_user can traverse in to execute box/cgl-build.
- name: Create the deploy directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: "{{ deploy_base }}", owner: root }
    - { path: "{{ deploy_clone }}", owner: "{{ runtime_user }}" }

# Both only exist where the box builds: a pulling instance has no second user
# to hand images over from, and no source to compile.
- name: Create the handoff directory
  when: image_source == 'build'
  ansible.builtin.file:
    path: "{{ handoff_dir }}"
    state: directory
    owner: "{{ build_user }}"
    group: "{{ runtime_user }}"
    # Group-writable, not merely readable: the runtime user removes each
    # archive once it has loaded it, and unlinking a file needs write on the
    # directory holding it rather than on the file. 0750 let it read the
    # archive and then fail to clean up, which took the deploy down after the
    # images were already in place.
    #
    # Still narrow: 0770 with no world bits, between two accounts that are
    # already on either side of this handoff, and the group is the runtime
    # user's own.
    mode: "0770"

# The box's own copy of this repository, which is what phase two runs from —
# so the box can redeploy with no laptop in the loop, and the manual and
# automatic paths execute the same code. Cloned here at whatever the default
# branch is; ./deploy.sh then has phase two check out the exact commit you ran
# it from.
#
# Over https and with no credential, because the repository is public: it
# carries no secrets, which is what makes that possible.
- name: Clone this repository onto the box
  ansible.builtin.git:
    repo: "{{ deploy_repo }}"
    dest: "{{ deploy_clone }}"
    version: main
    # Phase two moves HEAD around by design, so ansible must not treat that as
    # drift to be corrected on the next ground sweep.
    update: false
  become: true
  become_user: "{{ runtime_user }}"

# A full mirror of the application, ~100 MB, which is what makes any reachable
# commit checkoutable without depending on GitHub serving arbitrary SHAs to a
# fetch. Owned by the build user, since building is all it is for.
- name: Mirror the application repository
  when: image_source == 'build'
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_mirror }}"
    bare: true
    update: false
  become: true
  become_user: "{{ build_user }}"

# The public half of the stack's environment: everything in host_vars, which is
# Auth0 identifiers and Sentry DSNs and nothing secret. Rewritten on every
# ground sweep.
- name: Template the public environment
  ansible.builtin.template:
    src: env.config.j2
    dest: "{{ runtime_home }}/env.config"
    owner: "{{ runtime_user }}"
    group: "{{ runtime_user }}"
    mode: "0644"

# Created empty so the compose mount always resolves; box/cgl-secrets fills it
# when a destination is given. force: false, so a ground sweep never overwrites
# a key that is in use.
- name: Ensure the backup key file exists, readable to nobody else
  ansible.builtin.copy:
    dest: "{{ runtime_home }}/backup_key"
    content: ""
    owner: "{{ runtime_user }}"
    group: "{{ runtime_user }}"
    mode: "0600"
    force: false

- name: Install the nightly backup unit and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - cgl-backup.service
    - cgl-backup.timer
  notify: reload systemd

- name: Reload systemd before starting the timer
  ansible.builtin.meta: flush_handlers

# Enabled unconditionally: backup.sh exits 0 the moment it sees
# BACKUP_ENABLED is not "true", so a box with no destination runs a no-op
# nightly rather than needing the timer added later by someone who remembers.
- name: Enable the nightly backup
  ansible.builtin.systemd_service:
    name: cgl-backup.timer
    enabled: true
    state: started

- name: Template the paths phase two works with
  ansible.builtin.template:
    src: box.env.j2
    dest: "{{ box_env }}"
    owner: "{{ runtime_user }}"
    group: "{{ runtime_user }}"
    mode: "0644"

# The other half, which ansible creates empty and never writes: the Postgres
# password and the admin bootstrap address are generated or given on the box
# (box/cgl-env), so no secret passes through ansible's variables or logs.
# force: false is what keeps a ground sweep from wiping them.
- name: Ensure the secret environment exists, readable to nobody else
  ansible.builtin.copy:
    dest: "{{ runtime_home }}/env.secret"
    content: ""
    owner: "{{ runtime_user }}"
    group: "{{ runtime_user }}"
    mode: "0600"
    force: false
