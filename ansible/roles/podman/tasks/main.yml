---
# Debian's own podman, which on trixie is 5.4.2 — new enough for Quadlet and
# for pasta as the default rootless network backend. No third-party apt
# repository, which is one fewer signing key and one fewer trusted origin than
# Docker's own install method needs.
- name: Install podman and the compose plugin
  ansible.builtin.apt:
    name:
      - podman
      # podman's Docker-API socket is what lets the app repository's own
      # docker-compose.yml run verbatim, `depends_on: condition:
      # service_healthy` included — the part every compose reimplementation
      # handles worst. docker-compose here is the upstream compose plugin
      # speaking to that socket, with no Docker daemon anywhere.
      - docker-compose
    state: present

# Podman assumes no registry, deliberately, and Debian ships registries.conf
# with none configured — so `FROM postgres:18` resolves to nothing and the
# build fails on a short name that Docker would have silently completed.
#
# One registry rather than a list: the application's five base images
# (golang, debian, postgres, node, nginx) are all Docker Hub official, and a
# single entry means a short name cannot quietly resolve somewhere else. A
# drop-in rather than an edit to registries.conf, so a package update to that
# file is not something to merge by hand.
- name: Let short image names resolve to Docker Hub, and nowhere else
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/00-unqualified-search.conf
    content: |
      unqualified-search-registries = ["docker.io"]
    mode: "0644"

- name: Create the per-user systemd directories
  ansible.builtin.file:
    path: "{{ item.home }}/.config/systemd/user"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0755"
  loop:
    - { user: "{{ runtime_user }}", home: "{{ runtime_home }}" }
    - { user: "{{ build_user }}", home: "{{ build_home }}" }

# Enabled for the runtime user alone. The build user needs podman to build,
# which is a fork/exec of buildah and needs no socket at all — so it is not
# given one, and a hostile package install script in the build namespace finds
# no API to talk to.
- name: Enable podman's Docker-API socket for the runtime user
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ runtime_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ runtime_uid }}"

# Keeps the build cache from growing without bound — each distinct
# package-lock.json pins its own ~500 MB layer set. `builder prune` rather than
# `system prune` deliberately: it touches the cache alone, and never a tagged
# image. Those are the point rather than clutter, since an image tagged by SHA
# is what makes returning to a commit take seconds.
#
# A systemd timer rather than cron, because a minimal Debian ships no crontab
# and everything else here is already systemd-shaped.
- name: Install the build cache prune unit and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - cgl-build-prune.service
    - cgl-build-prune.timer
  notify: reload systemd

- name: Reload systemd before starting the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the weekly prune
  ansible.builtin.systemd_service:
    name: cgl-build-prune.timer
    enabled: true
    state: started
