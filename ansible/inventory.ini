# One host per instance, one v-server per instance. The host is named by the
# domain it serves, which is also what ./deploy.sh takes as its first argument
# and what host_vars/<domain>.yml is named after — so an instance is one file
# and one line here, and there is no alias to keep in step with anything.
[chatgamelab]
dev.cgl.fmnoel.de  ansible_user=root
prod.cgl.fmnoel.de ansible_user=root
