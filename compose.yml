# The stack as this box runs it. Derived from the application repository's own
# docker-compose.yml, with four deliberate differences:
#
#   - The image reference is composed, because an instance either builds or
#     pulls. A building box gets IMAGE_PREFIX=localhost and IMAGE_TAG=<commit
#     sha>, which is what makes any commit deployable and what makes returning
#     to one already built take seconds. A pulling box gets the registry and a
#     release tag, so it runs the artefact CI tested.
#   - web publishes a port on localhost. Under Coolify the proxy reached the
#     container directly; here nginx on the host is the sole public entry
#     point, and a rootless container cannot bind below 1024 anyway.
#   - The schema.sql bind mount is gone. The backend embeds schema.sql and
#     migrations/*.sql and applies them itself (server/db/init.go:26,29), so
#     the mount only pinned the deploy repo to an application schema version.
#   - The backup secret block is gone, along with its /dev/null default.
#     Backups are off here; turning them on is deliberate work.
#
# Environment arrives as two files: env.config, which ansible renders from
# host_vars and holds only public values, and env.secret, which is generated on
# the box and holds the Postgres password and the admin bootstrap address.

services:
  db:
    image: ${IMAGE_PREFIX}/chatgamelab-db:${IMAGE_TAG}
    container_name: chatgamelab-db
    environment:
      POSTGRES_DB: chatgamelab
      POSTGRES_USER: chatgamelab
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # docker/db/backup.sh requires both by name.
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      # Off unless a destination has been configured on the box; backup.sh
      # exits 0 immediately when it is not "true".
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_SSH_HOST: ${BACKUP_SSH_HOST:-}
      BACKUP_SSH_PORT: ${BACKUP_SSH_PORT:-22}
      BACKUP_SSH_USER: ${BACKUP_SSH_USER:-}
      BACKUP_PATH: ${BACKUP_PATH:-backups}
      BACKUP_SSH_KEY: /run/secrets/backup_key
    volumes:
      - db_data:/var/lib/postgresql
      # Always mounted, so the stack starts whether or not backups are
      # configured — ansible creates the file empty and box/cgl-secrets fills
      # it. A key that is never read costs nothing; a mount that sometimes
      # exists would mean two compose files.
      - ${BACKUP_KEY_PATH}:/run/secrets/backup_key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgamelab -d chatgamelab"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX}/chatgamelab-backend:${IMAGE_TAG}
    container_name: chatgamelab-backend
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      PORT_BACKEND: ${PORT_BACKEND}
      PORT_POSTGRES: ${PORT_POSTGRES}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      PUBLIC_URL: ${PUBLIC_URL}
      API_BASE_URL: ${API_BASE_URL}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND}
      # Read only to report backup health on /api/status: the backend grades
      # the newest row in the backup logbook, and treats an unset
      # BACKUP_ENABLED as "no backups configured" rather than as a fault. Sent
      # here as well as to db, which is the half that actually takes them —
      # without it a box with working backups still reports "disabled".
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      # How old the newest successful run may be before /api/status calls it
      # stale. The nightly timer runs daily, so the default of 48h tolerates
      # one missed night before complaining.
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-48}
      # Backend-only: it turns on debug logging, db.Preseed's well-known dev
      # accounts, and two routes with no authentication, which the nginx vhost
      # refuses at the edge. The frontend is unaffected — its dev switch is
      # Vite's build-time import.meta.env.DEV (web/src/providers/auth/
      # useTokenManager.ts:33), false in a production build — so sign-in here
      # goes through Auth0 exactly as it would with dev mode off.
      DEV_MODE: ${DEV_MODE}
      # DEV_JWT_SECRET is absent from this list deliberately, and that absence
      # is what makes DEV_MODE safe to run: unreachable by the container, the
      # HS256 signing path refuses, and GET /api/users/{id}/jwt can mint
      # nothing. box/cgl-deploy refuses to start a stack where both are set.
      # The address that becomes admin on a database with no admin yet. Inert
      # on any other database: the bootstrap closes once one exists
      # (server/db/user_roles.go:55), which is why ./deploy.sh asks for it at
      # --reset-db and at no other time.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/cgl", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["server"]
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX}/chatgamelab-web:${IMAGE_TAG}
    container_name: chatgamelab-web
    environment:
      API_BASE_URL: ${API_BASE_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      PUBLIC_URL: ${PUBLIC_URL}
      SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_BIND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
